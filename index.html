    <!-- WebMCP: Immediate Model Context Protocol Tool Registration -->
    <script>
      (function () {
        function registerWebMcp() {
          var mc =
            (typeof navigator !== "undefined" && navigator.modelContext) ||
            (typeof document !== "undefined" && document.modelContext);
          if (!mc || typeof mc.registerTool !== "function" || window.__tattvakoshaWebMcpBootstrapped) {
            return;
          }
          window.__tattvakoshaWebMcpBootstrapped = true;
          var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
          var opts = controller ? { signal: controller.signal } : undefined;
          var tools = [
            {
              name: "search_tattvakosha",
              title: "Search Tattvakośa Sanskrit Lexicon",
              description: "Search 688 classical Sanskrit headwords by Devanāgarī, IAST, ASCII phonetic, or English gloss.",
              inputSchema: {
                type: "object",
                properties: {
                  query: { type: "string", description: "Devanāgarī, IAST, ASCII, or English search query" },
                  pillar: { type: "string", enum: ["all", "kosha", "lakshana", "ekakshara", "nirukti"] },
                  limit: { type: "number" }
                },
                required: ["query"]
              },
              execute: async function (args) {
                if (window.__tattvakoshaWebMcp && window.__tattvakoshaWebMcp.search) {
                  return window.__tattvakoshaWebMcp.search(args || {});
                }
                var q = encodeURIComponent(String((args && args.query) || ""));
                var p = encodeURIComponent(String((args && args.pillar) || "all"));
                var l = encodeURIComponent(String((args && args.limit) || 10));
                var res = await fetch("./api/search?q=" + q + "&pillar=" + p + "&limit=" + l);
                return res.json();
              },
              annotations: { readOnlyHint: true }
            },
            {
              name: "get_sanskrit_entry",
              title: "Get Tattvakośa Headword Entry",
              description: "Retrieve the complete scholarly entry, pramāṇa sūtra, padaccheda split, Ekākṣara registers, prosody scan, and citation for a headword ID.",
              inputSchema: {
                type: "object",
                properties: {
                  id: { type: "string", description: "Entry ID such as jiva, ekakshara-a, pramana, surya" }
                },
                required: ["id"]
              },
              execute: async function (args) {
                if (window.__tattvakoshaWebMcp && window.__tattvakoshaWebMcp.entry) {
                  return window.__tattvakoshaWebMcp.entry(args || {});
                }
                var id = encodeURIComponent(String((args && args.id) || ""));
                var res = await fetch("./api/entry?id=" + id);
                return res.json();
              },
              annotations: { readOnlyHint: true }
            },
            {
              name: "open_sanskrit_entry",
              title: "Open Headword in Lexicon Workbench",
              description: "Open a specific Sanskrit headword inside the Tattvakośa lexicon workbench.",
              inputSchema: {
                type: "object",
                properties: {
                  id: { type: "string", description: "Entry ID to open (or 'lexicon' for the default reader)" }
                },
                required: ["id"]
              },
              execute: async function (args) {
                var id = String((args && args.id) || "lexicon").trim();
                window.location.hash = "#" + id;
                return { opened: id, url: window.location.href };
              }
            },
            {
              name: "pronounce_sanskrit",
              title: "Pronounce Classical Sanskrit at 24 kHz",
              description: "Recite a Sanskrit headword or sūtra at 24,000 Hz in the browser using Ninada v5.1 ONNX (male voice).",
              inputSchema: {
                type: "object",
                properties: {
                  text: { type: "string", description: "Devanāgarī Sanskrit text to pronounce" },
                  voice: { type: "string", enum: ["male"] }
                },
                required: ["text"]
              },
              execute: async function (args) {
                if (window.__tattvakoshaWebMcp && window.__tattvakoshaWebMcp.pronounce) {
                  return window.__tattvakoshaWebMcp.pronounce(args || {});
                }
                return { queued: false, error: "Audio studio still initializing; retry in a moment." };
              }
            }
          ];
          for (var i = 0; i < tools.length; i++) {
            var t = tools[i];
            t.parameters = t.inputSchema;
            t.handler = t.execute;
            try {
              if (opts) mc.registerTool(t, opts);
              else mc.registerTool(t);
            } catch (_) {
              try { mc.registerTool(t); } catch (__) {}
            }
          }
        }
        registerWebMcp();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", registerWebMcp);
        }
      })();
    </script>
